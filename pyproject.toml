[project]
name = "forge-lens-fl"
version = "0.2.2"
description = "Local-first, open-source agentic observability: traces, tools, tokens, cost and evidence."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Edgar Sócrates Caria" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
keywords = ["observability", "opentelemetry", "openinference", "agents", "llm", "tracing"]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.urls]
Repository = "https://github.com/EdgarSocrates98/forge-lens"
Issues = "https://github.com/EdgarSocrates98/forge-lens/issues"

[project.scripts]
# Route the installed command through the small dispatcher so a bare
# `forge-lens install` gets the guided wizard on a real TTY.  Pointing the
# entry point directly at the Typer object bypasses that contract in wheels.
forge-lens = "forge_lens.cli.main:main"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "types" },
    { include-group = "audit" },
]
lint = ["ruff>=0.8"]
test = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "httpx>=0.27",
]
types = ["mypy>=1.13"]
audit = ["pip-audit>=2.7"]

[build-system]
requires = ["uv_build>=0.8.0,<0.13"]
build-backend = "uv_build"

# The PyPI distribution is `forge-lens-fl` but the import package stays
# `forge_lens` — without this, uv_build expects src/forge_lens_fl/.
[tool.uv.build-backend]
module-name = "forge_lens"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "S", "DTZ", "PT", "PTH", "TID"]
ignore = [
    "S608", # SQL is built from fixed fragments + parameters only
]

[tool.ruff.lint.per-file-ignores]
# vendored forge_obsidian engine — byte-parity; linted in the canonical repo.
"src/forge_lens/_forge_obsidian/**" = ["ALL"]
# Vendored shared bootstrap — canonical copy in forge-doctor-api is the lint target.
"scripts/forge_bootstrap.py" = ["ALL"]
# Lab emitter parses its own just-written junit artifact — not untrusted input.
"scripts/lab/forge_lens_lab.py" = ["S314"]
"tests/**" = ["S101", "PT011", "PTH", "S105", "S106"]
"examples/**" = ["S101", "T201"]
# Homologation runner — subprocess/urllib against the local install is the point.
"homolog/**" = ["S101", "S105", "S310", "S603", "PTH"]
"src/forge_lens/cli/**" = ["T201"]
# Vendored Forge UI kit (canonical: the-forge/src/theforge/ui) —
# byte-identical to the shared source; linted in the canonical repo.
"src/forge_lens/ui/**/*.py" = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "e2e: end-to-end scenarios",
    "contract: contract and schema tests",
    "benchmark: benchmark smoke tests (tests/bench)",
    "network: legitimately opens sockets (exempt from the offline gate)",
]

[tool.coverage.run]
source = ["src/forge_lens"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["forge_lens"]
strict = true
warn_unreachable = true
# Vendored Forge UI kit — mesma razão da exclusão de lint.
exclude = ["forge_lens.ui"]
