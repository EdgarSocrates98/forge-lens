name: release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type the version to release (must match pyproject)"
        required: true

permissions:
  contents: read

# one release run at a time — never cancel mid-publish
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - run: uv sync --locked --extra server --all-groups
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run python -m pytest -q
      - name: version gate — input must match pyproject
        run: |
          V=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          test "$V" = "${{ inputs.confirm }}" || {
            echo "input '${{ inputs.confirm }}' != pyproject '$V'"; exit 1; }
      - run: uv build
      - name: sbom — runtime deps + server extra only (dev group pruned)
        run: uv run --locked --exact --no-dev --extra server python scripts/gen_sbom.py > dist/sbom.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 30
  # PyPI publication does NOT live here — it lives in publish-pypi.yml,
  # the standard pipeline shared across the FORJAS repos (build once →
  # OIDC trusted publish → clean-venv verify). This workflow only proves
  # the release candidate and stores dist/ as an artifact.
