name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra server --all-groups
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest --cov=src/forge_lens --cov-report=term-missing
      - run: uv run python -m build
      - name: schemas are in sync with models
        run: |
          uv run python -m forge_lens.contracts.jsonschema > /dev/null
          git diff --exit-code schemas/v1/ || (echo "schemas/v1 out of date — run python -m forge_lens.contracts.jsonschema" && exit 1)

  sdk-ts:
    name: sdk-ts (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    defaults:
      run:
        working-directory: packages/forge-lens-sdk-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/forge-lens-sdk-ts/package-lock.json
      - run: npm ci
      - run: npm test

  security:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra server --all-groups
      - run: uv run pip-audit
